<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Photo Developer</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1a1a1a" />

<!-- iOS home-screen support -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PhotoDev" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #1a1a1a; color: #e8e4dc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  input[type="range"] { -webkit-appearance: none; height: 28px; background: transparent; width: 100%; }
  input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: #3a3a3a; border-radius: 2px; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; margin-top: -10px;
    width: 24px; height: 24px; border-radius: 50%; background: #c9a15c; border: none; }
  button { font-family: inherit; -webkit-user-select: none; user-select: none; }
  img { -webkit-user-drag: none; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script type="text/babel" data-presets="react" src="app.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
